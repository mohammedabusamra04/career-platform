version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-20}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - PIPELINE_API_SECRET=${PIPELINE_API_SECRET}
      - JOB_RUN_TIME_1=${JOB_RUN_TIME_1:-09:00}
      - JOB_RUN_TIME_2=${JOB_RUN_TIME_2:-18:00}
      - DAILY_DIGEST_TIME=${DAILY_DIGEST_TIME:-21:00}
      - TIMEZONE=${TIMEZONE:-Asia/Gaza}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - MIN_MATCH_SCORE=${MIN_MATCH_SCORE:-40}
