name: Scheduled Job Pipeline

on:
  schedule:
    # Safety net for the single 21:00 Asia/Gaza evening dispatch (19:00 UTC in winter / 18:00 UTC in summer).
    # Primary on-time trigger is an external scheduler (cron-job.org) calling workflow_dispatch.
    - cron: '0 19 * * *'
  workflow_dispatch:
    # Allows manual or external cron (e.g. cron-job.org) triggering anytime

jobs:
  run-pipeline:
    name: Run Job Collection & Telegram Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Daily Job Pipeline
        env:
          NODE_ENV: production
          PORT: 3000
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          JOB_RUN_TIME_1: ${{ secrets.JOB_RUN_TIME_1 || '21:00' }}
          JOB_RUN_TIME_2: ${{ secrets.JOB_RUN_TIME_2 || '21:00' }}
          DAILY_DIGEST_TIME: ${{ secrets.DAILY_DIGEST_TIME || '21:00' }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Gaza' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE || '40' }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run pipeline:run