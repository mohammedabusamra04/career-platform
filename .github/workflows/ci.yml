name: CI Quality & Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      TELEGRAM_BOT_TOKEN: "123456:mock_bot_token"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/career_platform?schema=public"
      SESSION_SECRET: "test-session-secret-key-32-chars-minimum"
      PIPELINE_API_KEY: "test-pipeline-api-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cp packageLock.json package-lock.json
          npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Project
        run: npm run build
